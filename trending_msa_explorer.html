<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trending in Your Neighborhood — MSA Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e17; color: #e0e6ed; overflow: hidden; height: 100vh; }

.app { display: grid; grid-template-columns: 1fr 420px; grid-template-rows: auto 1fr; height: 100vh; }

/* Header */
.header { grid-column: 1 / -1; padding: 12px 24px; background: linear-gradient(135deg, #003087 0%, #001e5a 100%); display: flex; align-items: center; gap: 20px; border-bottom: 2px solid #0070ba; }
.header h1 { font-size: 18px; font-weight: 700; color: #fff; white-space: nowrap; }
.header .subtitle { font-size: 12px; color: #7eb8e0; }

/* Controls bar */
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; flex: 1; }
.control-group { display: flex; align-items: center; gap: 6px; }
.control-group label { font-size: 11px; color: #a0b4c8; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
select, input[type="text"] { background: #0d1a2d; border: 1px solid #1e3a5f; color: #e0e6ed; padding: 5px 10px; border-radius: 6px; font-size: 12px; outline: none; }
select:focus, input:focus { border-color: #0070ba; }
.toggle-group { display: flex; gap: 2px; }
.toggle-btn { padding: 5px 12px; font-size: 11px; border: 1px solid #1e3a5f; background: #0d1a2d; color: #7eb8e0; cursor: pointer; transition: all 0.2s; }
.toggle-btn:first-child { border-radius: 6px 0 0 6px; }
.toggle-btn:last-child { border-radius: 0 6px 6px 0; }
.toggle-btn.active { background: #0070ba; color: #fff; border-color: #0070ba; }
.stat-badge { background: #0d1a2d; border: 1px solid #1e3a5f; border-radius: 6px; padding: 4px 10px; font-size: 11px; }
.stat-badge .num { color: #0070ba; font-weight: 700; font-size: 14px; }

/* Map */
.map-container { position: relative; background: #0d1117; overflow: hidden; }
.map-svg { width: 100%; height: 100%; }

/* Dots */
.msa-dot { cursor: pointer; transition: all 0.2s; }
.msa-dot:hover { filter: brightness(1.4); }
.msa-label { font-size: 2.5px; fill: #7eb8e0; pointer-events: none; font-family: -apple-system, sans-serif; }

/* Tooltip */
.tooltip { position: absolute; display: none; background: #111827; border: 1px solid #1e3a5f; border-radius: 10px; padding: 12px 16px; max-width: 340px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.6); pointer-events: none; }
.tooltip .tt-msa { font-size: 14px; font-weight: 700; color: #0070ba; margin-bottom: 6px; }
.tooltip .tt-stats { font-size: 11px; color: #7eb8e0; margin-bottom: 8px; }
.tooltip .tt-item { font-size: 11px; padding: 3px 0; border-bottom: 1px solid #1a2332; display: flex; justify-content: space-between; gap: 8px; }
.tooltip .tt-item:last-child { border: none; }
.tooltip .tt-rank { color: #555; font-weight: 600; min-width: 20px; }
.tooltip .tt-title { flex: 1; color: #e0e6ed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tooltip .tt-merch { color: #6b7280; font-size: 10px; }
.tooltip .tt-delta { color: #34d399; font-weight: 600; min-width: 35px; text-align: right; }

/* Side panel */
.panel { background: #111827; border-left: 1px solid #1e3a5f; display: flex; flex-direction: column; overflow: hidden; }
.panel-header { padding: 14px 18px; border-bottom: 1px solid #1e3a5f; }
.panel-header h2 { font-size: 15px; font-weight: 700; color: #fff; }
.panel-header .panel-sub { font-size: 11px; color: #6b7280; margin-top: 2px; }
.panel-search { padding: 10px 18px; border-bottom: 1px solid #1e3a5f; }
.panel-search input { width: 100%; background: #0d1a2d; border: 1px solid #1e3a5f; color: #e0e6ed; padding: 7px 12px; border-radius: 6px; font-size: 12px; }
.panel-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.panel-list::-webkit-scrollbar { width: 6px; }
.panel-list::-webkit-scrollbar-track { background: #111827; }
.panel-list::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 3px; }

.product-row { padding: 10px 18px; border-bottom: 1px solid #1a2332; cursor: pointer; transition: background 0.15s; display: grid; grid-template-columns: 24px 1fr 50px; gap: 8px; align-items: start; }
.product-row:hover { background: #1a2332; }
.product-row.highlight { background: #0c2d48; }
.pr-rank { font-size: 12px; color: #4b5563; font-weight: 700; text-align: center; padding-top: 2px; }
.pr-info { min-width: 0; }
.pr-title { font-size: 12px; color: #e0e6ed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.pr-meta { font-size: 10px; color: #6b7280; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.pr-meta span { white-space: nowrap; }
.pr-merchant { color: #0070ba; }
.pr-price { color: #9ca3af; }
.pr-ubiq { color: #f59e0b; }
.pr-scores { text-align: right; padding-top: 2px; }
.pr-delta { font-size: 13px; font-weight: 700; color: #34d399; }
.pr-adj { font-size: 10px; color: #6b7280; }

/* Legend */
.legend { position: absolute; bottom: 16px; left: 16px; background: rgba(17,24,39,0.9); border: 1px solid #1e3a5f; border-radius: 8px; padding: 10px 14px; }
.legend-title { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #a0b4c8; margin: 3px 0; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }

.empty-state { padding: 40px 20px; text-align: center; color: #4b5563; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>Trending in Your Neighborhood</h1>
      <div class="subtitle">MSA Product Explorer — v5.1</div>
    </div>
    <div class="controls">
      <div class="control-group">
        <label>View</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-view="curated" onclick="setView('curated')">Curated (Top 15)</button>
          <button class="toggle-btn" data-view="retrieval" onclick="setView('retrieval')">Retrieval (Top 100)</button>
        </div>
      </div>
      <div class="control-group">
        <label>Merchant</label>
        <select id="merchantFilter" onchange="applyFilters()">
          <option value="">All Merchants</option>
        </select>
      </div>
      <div class="control-group">
        <label>Min Delta</label>
        <select id="deltaFilter" onchange="applyFilters()">
          <option value="0">Any</option>
          <option value="5">5+</option>
          <option value="10">10+</option>
          <option value="20">20+</option>
          <option value="50">50+</option>
        </select>
      </div>
      <div class="control-group">
        <label>Locality</label>
        <select id="localityFilter" onchange="applyFilters()">
          <option value="0">All</option>
          <option value="1">Local only (1 MSA)</option>
          <option value="3">≤3 MSAs</option>
          <option value="5">≤5 MSAs</option>
          <option value="10">≤10 MSAs</option>
        </select>
      </div>
      <div class="stat-badge">MSAs: <span class="num" id="statMsas">0</span></div>
      <div class="stat-badge">Products: <span class="num" id="statProducts">0</span></div>
    </div>
  </div>

  <div class="map-container" id="mapContainer">
    <svg class="map-svg" id="mapSvg" viewBox="-10 -5 160 95"></svg>
    <div class="tooltip" id="tooltip"></div>
    <div class="legend">
      <div class="legend-title">Dot size = # products</div>
      <div class="legend-row"><div class="legend-dot" style="background:#0070ba;width:8px;height:8px;"></div> Curated MSA</div>
      <div class="legend-row"><div class="legend-dot" style="background:#374151;width:8px;height:8px;"></div> Retrieval only</div>
      <div class="legend-row"><div class="legend-dot" style="background:#f59e0b;width:8px;height:8px;"></div> Selected</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 id="panelTitle">Click an MSA on the map</h2>
      <div class="panel-sub" id="panelSub">Or browse all products below</div>
    </div>
    <div class="panel-search">
      <input type="text" id="searchBox" placeholder="Search products or merchants..." oninput="filterPanel()">
    </div>
    <div class="panel-list" id="panelList">
      <div class="empty-state">Select an MSA from the map to see its trending products</div>
    </div>
  </div>
</div>

let currentView = 'curated';
let selectedMsa = null;
let filteredData = [];

// Mercator projection (simplified for contiguous US)
function project(lat, lon) {
  // Shift Honolulu into view
  if (lat < 25 && lon < -150) { return [8, 82]; }
  const x = (lon + 130) * (150 / 65);
  const y = (50 - lat) * (90 / 28);
  return [x, y];
}

function getData() {
  return currentView === 'curated' ? DATA_CURATED : DATA_RETRIEVAL;
}

function getFilteredData() {
  let data = getData();
  const merchant = document.getElementById('merchantFilter').value;
  const minDelta = parseInt(document.getElementById('deltaFilter').value);
  const maxMsas = parseInt(document.getElementById('localityFilter').value);

  if (merchant) data = data.filter(d => d.merchant === merchant);
  if (minDelta > 0) data = data.filter(d => d.delta >= minDelta);
  if (maxMsas > 0) data = data.filter(d => d.nMsas <= maxMsas);

  return data;
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  populateMerchantFilter();
  applyFilters();
}

function populateMerchantFilter() {
  const data = getData();
  const merchants = [...new Set(data.map(d => d.merchant))].sort();
  const sel = document.getElementById('merchantFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="">All Merchants</option>' +
    merchants.map(m => `<option value="${m}"${m===current?' selected':''}>${m}</option>`).join('');
}

function applyFilters() {
  filteredData = getFilteredData();
  renderMap();
  if (selectedMsa) renderPanel(selectedMsa);
  updateStats();
}

function updateStats() {
  const msas = new Set(filteredData.map(d => d.msa));
  document.getElementById('statMsas').textContent = msas.size;
  document.getElementById('statProducts').textContent = filteredData.length;
}

  const svg = document.getElementById('mapSvg');

  // Group data by MSA
  const msaGroups = {};
  filteredData.forEach(d => {
    if (!msaGroups[d.msa]) msaGroups[d.msa] = [];

  const allMsas = {};
  allData.forEach(d => {
    if (!allMsas[d.msa]) allMsas[d.msa] = [];
    allMsas[d.msa].push(d);
  });

  let dotsHtml = '';

  // US contiguous border outline (projected from geographic coordinates)
  const usOutline = `M 12.2,5.1 L 16.2,5.1 16.2,3.2 30.0,3.2 32.3,3.2 46.2,3.2 60.0,3.2 75.7,3.2 80.3,1.9 93.5,6.4 96.9,8.0 104.3,11.2 107.3,12.9 109.6,16.1 110.8,20.9 117.7,22.5 117.7,21.5 123.5,19.3 126.9,16.7 127.6,16.1 135.0,16.1 142.4,8.7 144.7,8.4 145.4,14.5 145.6,16.7 143.1,18.0 140.8,19.6 136.8,22.2 138.5,25.7 137.3,27.3 133.8,28.0 129.5,29.6 129.2,30.5 128.8,33.8 126.9,35.7 126.7,37.0 124.6,41.8 124.6,43.4 125.8,47.6 121.2,50.8 117.2,54.6 113.5,57.9 112.6,61.1 112.4,62.7 111.9,64.3 113.1,67.5 114.2,70.7 114.9,73.9 115.2,77.8 114.2,80.4 111.2,82.0 112.6,80.4 110.8,77.1 109.2,72.3 108.9,69.1 108.5,67.5 106.2,65.9 105.0,64.3 102.9,65.2 99.2,63.6 96.9,63.3 94.6,63.6 93.5,66.5 94.6,67.5 91.2,67.5 88.8,65.9 85.4,65.9 83.1,64.9 81.2,66.5 79.6,68.1 76.2,72.3 75.7,77.1 75.0,77.8 71.5,75.5 62.3,65.9 54.2,60.1 50.3,60.1 35.1,56.2 29.5,55.6 29.3,54.6 26.8,52.1 23.3,50.1 20.8,46.6 18.5,43.1 17.3,39.2 15.9,37.6 14.3,33.8 13.4,29.6 13.2,25.7 12.9,20.9 13.6,12.2 Z`;

  // Hawaii inset box (bottom-left)
  const hawaiiBox = `M 2,78 L 14,78 14,88 2,88 Z`;

  dotsHtml += `<path d="${usOutline}" fill="#0d1117" fill-opacity="0.5" stroke="#1e3a5f" stroke-width="0.5" stroke-linejoin="round"/>`;
  dotsHtml += `<path d="${hawaiiBox}" fill="none" stroke="#1e3a5f" stroke-width="0.3" stroke-dasharray="1,1" opacity="0.5"/>`;
  dotsHtml += `<text x="8" y="77" font-size="3" fill="#2a3f5f" font-family="sans-serif">HI</text>`;

  Object.keys(MSA_COORDS).forEach(msa => {
    const [lat, lon] = MSA_COORDS[msa];
    const [x, y] = project(lat, lon);
    const hasData = msaGroups[msa];
    const count = hasData ? msaGroups[msa].length : 0;
    const inFull = allMsas[msa];

    if (!hasData && !inFull) return;

    const r = hasData ? Math.max(1.3, Math.min(3.5, 1.05 + count * 0.14)) : 0.85;
    const fill = selectedMsa === msa ? '#f59e0b' : (hasData ? '#0070ba' : '#374151');
    const opacity = hasData ? 0.85 : 0.4;
    const stroke = selectedMsa === msa ? '#fbbf24' : (hasData ? '#38bdf8' : '#555');

    dotsHtml += `<circle class="msa-dot" cx="${x}" cy="${y}" r="${r}" fill="${fill}" 
      fill-opacity="${opacity}" stroke="${stroke}" stroke-width="0.4"
      data-msa="${msa}" data-count="${count}"
      onmouseenter="showTooltip(event,'${msa.replace(/'/g, "\\'")}')" 
      onmouseleave="hideTooltip()"
      onclick="selectMsa('${msa.replace(/'/g, "\\'")}')" />`;

    // Label for larger dots or selected
    if (count >= 8 || selectedMsa === msa) {
      const shortName = msa.split('-')[0].split(',')[0];
      dotsHtml += `<text class="msa-label" x="${x}" y="${y - r - 1.5}" text-anchor="middle" font-size="${selectedMsa===msa?'5':'4'}" fill="${selectedMsa===msa?'#f59e0b':'#4b6a8a'}">${shortName}</text>`;
    }
  });

  svg.innerHTML = dotsHtml;
}

function showTooltip(event, msa) {
  const tt = document.getElementById('tooltip');
  const items = filteredData.filter(d => d.msa === msa);
  if (items.length === 0) {
    const allItems = getData().filter(d => d.msa === msa);
    if (allItems.length === 0) return;
    tt.innerHTML = `<div class="tt-msa">${msa}</div><div class="tt-stats">${allItems.length} products (filtered out by current filters)</div>`;
  } else {
    const top5 = items.sort((a,b) => a.rank - b.rank).slice(0, 5);
    tt.innerHTML = `<div class="tt-msa">${msa}</div>
      <div class="tt-stats">${items.length} products | avg delta: ${Math.round(items.reduce((s,d)=>s+d.delta,0)/items.length)}</div>
      ${top5.map(d => `<div class="tt-item">
        <span class="tt-rank">#${d.rank}</span>
        <span class="tt-title">${d.title}</span>
        <span class="tt-delta">+${d.delta}</span>
      </div>`).join('')}`;
  }
  
  const rect = document.getElementById('mapContainer').getBoundingClientRect();
  let left = event.clientX - rect.left + 15;
  let top = event.clientY - rect.top - 10;
  if (left + 340 > rect.width) left = event.clientX - rect.left - 350;
  if (top + 200 > rect.height) top = rect.height - 210;
  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
  tt.style.display = 'block';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

function selectMsa(msa) {
  selectedMsa = selectedMsa === msa ? null : msa;
  renderMap();
  if (selectedMsa) {
    renderPanel(selectedMsa);
  } else {
    document.getElementById('panelTitle').textContent = 'Click an MSA on the map';
    document.getElementById('panelSub').textContent = 'Or browse all products below';
    document.getElementById('panelList').innerHTML = '<div class="empty-state">Select an MSA from the map to see its trending products</div>';
  }
}

function renderPanel(msa) {
  const items = filteredData.filter(d => d.msa === msa).sort((a,b) => a.rank - b.rank);
  const merchants = new Set(items.map(d => d.merchant));
  const localCount = items.filter(d => d.nMsas === 1).length;

  document.getElementById('panelTitle').textContent = msa;
  document.getElementById('panelSub').textContent = 
    `${items.length} products · ${merchants.size} merchants · ${localCount} local-only`;

  if (items.length === 0) {
    document.getElementById('panelList').innerHTML = '<div class="empty-state">No products match current filters for this MSA</div>';
    return;
  }

  document.getElementById('panelList').innerHTML = items.map(d => `
    <div class="product-row" onclick="window.open('${d.url}','_blank')" title="${d.title}">
      <div class="pr-rank">${d.rank}</div>
      <div class="pr-info">
        <div class="pr-title">${d.title}</div>
        <div class="pr-meta">
          <span class="pr-merchant">${d.merchant}</span>
          <span class="pr-price">${d.price}</span>
          <span class="pr-ubiq">${d.nMsas === 1 ? 'Local' : d.nMsas + ' MSAs'}</span>
        </div>
      </div>
      <div class="pr-scores">
        <div class="pr-delta">+${d.delta}</div>
        <div class="pr-adj">${d.adj.toFixed(3)}</div>
      </div>
    </div>
  `).join('');

  filterPanel();
}

function filterPanel() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  document.querySelectorAll('.product-row').forEach(row => {
    row.style.display = (!q || row.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}

// Init
populateMerchantFilter();
applyFilters();
</script>
